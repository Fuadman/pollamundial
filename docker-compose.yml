version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: pollamundial_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: copa_prediction
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d copa_prediction"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: pollamundial_redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend (NestJS)
  backend:
    build:
      context: ./services
      dockerfile: Dockerfile
    container_name: pollamundial_backend
    env_file:
      - ./.env.docker
    environment:
      NODE_ENV: development
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: user
      DATABASE_PASSWORD: password
      DATABASE_NAME: copa_prediction
      REDIS_URL: redis://redis:6379
      GOOGLE_CALLBACK_URL: http://localhost:3000/api/auth/google/callback
      JWT_EXPIRATION: 3600
      PORT: 3000
      LOG_LEVEL: debug
      TIMEZONE: America/La_Paz
      ENABLE_TESTING_MODE: false
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - ./services/src:/app/src
    command: npm run start:dev
    restart: unless-stopped

  # Frontend (Vite)
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: pollamundial_frontend
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_BACKEND_URL: http://backend:3000
    volumes:
      - ./client/src:/app/src
    command: npm run dev -- --host 0.0.0.0
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data: